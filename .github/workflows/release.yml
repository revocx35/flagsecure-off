name: Release
on:
  push:
    tags: [ 'v*' ]
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-37.0 build-tools;36.0.0"
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - name: Build Frida agent
        run: cd agent && npm ci && npm run build
      - name: Fetch frida-inject
        run: scripts/fetch-frida.sh
      - name: Configure signing (optional)
        # Set repo secrets RELEASE_KEYSTORE_BASE64, RELEASE_STORE_PASSWORD,
        # RELEASE_KEY_ALIAS, RELEASE_KEY_PASSWORD to get signed APKs. Without them,
        # the release APKs are unsigned and must be signed before they will install.
        env:
          KS: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > release.jks
            cat > keystore.properties <<PROP
          storeFile=release.jks
          storePassword=${{ secrets.RELEASE_STORE_PASSWORD }}
          keyAlias=${{ secrets.RELEASE_KEY_ALIAS }}
          keyPassword=${{ secrets.RELEASE_KEY_PASSWORD }}
          PROP
            echo "signed=yes" >> "$GITHUB_ENV"
          else
            echo "No signing secrets set — building unsigned release APKs." >&2
            echo "signed=no" >> "$GITHUB_ENV"
          fi
      - name: Assemble release
        run: ./gradlew :app:assembleRelease :xposed:assembleRelease --console=plain
      - name: Collect APKs
        run: |
          mkdir -p dist
          # Frida root app (per-ABI)
          cp app/build/outputs/apk/release/app-*-release*.apk dist/ 2>/dev/null || true
          # Xposed/LSPosed module (universal) — rename for clarity on the release page
          x=$(ls xposed/build/outputs/apk/release/xposed-release*.apk 2>/dev/null | head -1)
          [ -n "$x" ] && cp "$x" "dist/flagsecure-off-xposed.apk"
          ls -la dist
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          body: |
            Two ways to disable FLAG_SECURE (your own rooted device only):
            - **Xposed/LSPosed module** — `flagsecure-off-xposed.apk`. Enable in LSPosed, scope
              System Framework, reboot. No lag. Recommended if you have Xposed.
            - **Frida app** (no Xposed needed) — `app-arm64-v8a-release.apk`. Install, grant root,
              tap. Works without Zygisk but has runtime overhead.
            Neither defeats hardware DRM (Widevine L1). Signed: ${{ env.signed }}.
